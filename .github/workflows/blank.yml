name: Deploy to Snowflake (Hardcoded)

on:
  push:
    branches:
      - dev
      - test
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install schemachange
      run: pip install schemachange

    - name: Deploy to Snowflake
      run: |
        ENV_FOLDER=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')  # dev/test/main

        schemachange \
          -f schemachange/scripts/$ENV_FOLDER \
          --account qaifmdu-uv51997 \
          --user Raj \
          --password 'RahulRahul@353492' \
          --role ACCOUNTADMIN \
          --warehouse COMPUTE_WH \
          --database SAMPLE \
          --schema SAMPLESCHEMA \
          --create-change-history-table
