name: Deploy to Snowflake

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install schemachange
        run: |
          pip install schemachange

      - name: Create schemachange profile and deploy
        run: |
          mkdir -p ~/.schemachange

          cat <<EOF > ~/.schemachange/profiles.yml
default:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: qaifmdu-uv51997
      user: Raj
      password: RahulRahul@353492
      role: ACCOUNTADMIN
      warehouse: COMPUTE_WH
      database: SAMPLE
      schema: SAMPLESCHEMA
EOF

          schemachange -f schemachange/scripts/dev --create-change-history-table
