name: Print Love Symbol

on:
  push:
    branches:
      - test  # Trigger only on 'test' branch
  workflow_dispatch:

jobs:
  print_heart:
    runs-on: ubuntu-latest
    steps:
      - name: Print Big Heart Symbol
        run: |
          cat << 'EOF'
           ***       ***
         *******   *******
       *********** ***********
      ***************************
      ***************************
       *************************
         *********************
           *****************
             *************
               *********
                 *****
                   *
EOF
