name: Snowflake Schema Change
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install schemachange
      run: pip install schemachange==4.0.1  # Pin to version 4.0.1
    - name: debug schemachange
      run: |
        cat config.yml
        schemachange deploy \
          --config-file config.yml \
          --dry-run
    - name: Run schemachange
      env:
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      run: |
        schemachange deploy \
          --config-file config.yml \
          --scripts-folder "schemachange/scripts/dev" \
          --password "$SNOWFLAKE_PASSWORD"
